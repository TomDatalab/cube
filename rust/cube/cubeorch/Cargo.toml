[package]
name = "cubeorch"
version = "0.1.0"
edition = "2021"
description = "Query orchestrator of the Rust backend: QueryCache, refresh keys, pre-aggregations and QueryOrchestrator (port of cubejs-query-orchestrator)"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.8.2"
cubecache = { path = "../cubecache" }
# The orchestrator needs the trait, not the drivers; the binary picks those.
cubedriver = { path = "../cubedriver", default-features = false }
cubequeue = { path = "../cubequeue" }
futures = "0.3"
lru = "0.12"
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
