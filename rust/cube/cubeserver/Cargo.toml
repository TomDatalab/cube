[package]
name = "cubeserver"
version = "0.1.0"
edition = "2021"
description = "Cube REST API server (Rust replacement for @cubejs-backend/server)"
license = "Apache-2.0"

[[bin]]
name = "cube-server"
path = "src/main.rs"

[features]
default = ["all-drivers"]
# Every CUBEJS_DB_TYPE (cubedriver's default feature set).
all-drivers = ["cubedriver/default"]

[dependencies]
async-trait = "0.1.36"
cubeauth = { path = "../cubeauth" }
cubeconfig = { path = "../cubeconfig" }
cubegraphql = { path = "../cubegraphql" }
cubeorch = { path = "../cubeorch" }
cubesqlbridge = { path = "../cubesqlbridge" }
# Drivers come from `all-drivers`; `--no-default-features --features
# cubedriver/<name>,...` builds a server with only the listed ones.
cubedriver = { path = "../cubedriver", default-features = false }
cubemodel = { path = "../cubemodel" }
cubeplanner = { path = "../cubeplanner" }
cubequery = { path = "../cubequery" }
axum = { version = "0.7.9", features = ["default", "json", "query", "ws"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.127"
thiserror = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
jsonwebtoken = "9"
tempfile = "3"
temp-env = "0.3"
