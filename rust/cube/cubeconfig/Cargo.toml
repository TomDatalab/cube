[package]
name = "cubeconfig"
version = "0.1.0"
edition = "2021"
description = "Declarative configuration for the pure-Rust Cube backend (cube.yml), replacing cube.js/cube.py"
license = "Apache-2.0"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
