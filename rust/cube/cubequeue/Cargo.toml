[package]
name = "cubequeue"
version = "0.1.0"
edition = "2021"
description = "Query queue engine and queue drivers for Cube (port of cubejs-query-orchestrator QueryQueue to Rust)"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
chrono = "0.4"
cubecache = { path = "../cubecache" }
futures = "0.3"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
