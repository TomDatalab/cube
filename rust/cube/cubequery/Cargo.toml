[package]
name = "cubequery"
version = "0.1.0"
edition = "2021"
description = "REST API query model, parsing, normalization and validation for Cube (port of cubejs-api-gateway query handling to Rust)"
license = "Apache-2.0"

[dependencies]
chrono = "0.4.31"
chrono-tz = "0.8.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
