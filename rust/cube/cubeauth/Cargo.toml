[package]
name = "cubeauth"
version = "0.1.0"
edition = "2021"
description = "REST API authentication for Cube (port of cubejs-api-gateway auth to Rust)"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1.36"
jsonwebtoken = "9"
log = "0.4.21"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
