[package]
name = "cubestore-ws-transport"
version = "0.1.0"
edition = "2021"
description = "Async WebSocket client for CubeStore's binary protocol."

[dependencies]
cubeshared = { path = "../cubeshared" }
flatbuffers = "25.12.19"
tokio = { version = "1", features = ["full"] }
# rustls (ring), never native-tls: the Rust backend must not link OpenSSL.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Pin the crypto provider explicitly so `rustls::ClientConfig::builder()` has a
# default one even when this crate is built on its own.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
bytes = "1"
url = "2"
percent-encoding = "2"
base64 = "0.22"
thiserror = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
http = "1"
arrow = { version = "58", default-features = false, features = ["ipc"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
env_logger = "0.11"
